<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ai-lubricant.svg" />
    <script src="/iconfont.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ai Lubricant 智能开发平台</title>
    <!-- SEO 元标签 -->
    <meta name="description" content="Ai Lubricant 是一个智能开发平台，通过 AI 驱动的编程助手、自动化工作流和智能开发工具，帮助开发者更快速地构建应用程序。" />
    <meta name="keywords" content="AI代码生成, 智能编程, 开发者工具, 自动化编程, 代码助手, AI开发平台, Ai Lubricant, 人工智能编程" />
    <meta name="author" content="Ai Lubricant" />
    <meta name="robots" content="index, follow" />
    <script>
      (function () {
        var theme = "system";

        try {
          theme = localStorage.getItem("ai-lubricant-theme") || localStorage.getItem("monkeycode-theme") || "system";
          if (localStorage.getItem("monkeycode-theme")) {
            localStorage.setItem("ai-lubricant-theme", localStorage.getItem("monkeycode-theme"));
            localStorage.removeItem("monkeycode-theme");
          }
        } catch (error) {
          theme = "system";
        }

        var systemTheme = "light";

        try {
          systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (error) {
          systemTheme = "light";
        }
        var resolvedTheme = theme === "system" ? systemTheme : theme;

        if (resolvedTheme !== "dark" && resolvedTheme !== "light") {
          resolvedTheme = "light";
        }

        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(resolvedTheme);
        document.documentElement.style.colorScheme = resolvedTheme;
      })();
    </script>
    <!-- 必须在所有模块代码之前设置，确保 cap.js 使用本地 WASM 而非 CDN（jsdelivr.net 在国内不稳定） -->
    <!-- %BASE_URL% 由 Vite 在构建期替换成 base（dev 为 "/"，正式构建为 "/admin-static/"），
         保证 WASM 与其余静态资源同前缀，不会被后端 SPA fallback 吞成 HTML。 -->
    <script>window.CAP_CUSTOM_WASM_URL = location.origin + "%BASE_URL%captcha/cap_wasm.js";</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RQQN0BK11M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-RQQN0BK11M');
    </script>
  </body>
</html>
